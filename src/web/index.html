<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainf*ck JIT Runtime in WebAssembly</title>
  <script src="./readable-iterator.polyfill.js"></script>
</head>

<body>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .demo {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;

      .select {
        padding: 10px;

        h2 {
          margin: 0;
        }
      }

      .time {
        padding: 10px;

        p {
          margin: 0;
        }
      }

      h1 {
        text-align: center;
      }

      pre {
        background-color: black;
        color: #00ff87;
        flex: 1;
        margin: 0;
        padding: 15px;
        text-align: center;
        min-width: fit-content;
      }
    }
  </style>
  <div class="demo">
    <h1>Brainf*ck JIT Runtime in WebAssembly</h1>
    <div class="select">
      <h2>Select a Program</h2>
      <select id="options" name="options">
        <option value="hello.bf">Hello World</option>
        <option value="cat.bf">Cat</option>
        <option value="long.bf">Long</option>
        <option value="mandelbrot.bf">Mandelbrot</option>
        <option value="test.bf">Test</option>
        <option value="upload">Upload Custom Program</option>
      </select>
    </div>
    <div class="time">
      <p>Time: <span class="raw"></span>ms</p>
    </div>
    <pre id="output"></pre>
  </div>
  <script type="module">
    import init, { run } from './bf_jit_wasm.js';
    import { setMemory, output } from './imports.js';

    function readFileFromSystem() {
      return new Promise((resolve, reject) => {
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.b, .bf, .brainfuck, text/plain';
        fileInput.onchange = async (e) => {
          const file = e.target.files[0];
          const path = file.name;
          if (file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
              resolve({ source: e.target.result, path });
            };
            reader.onerror = reject;
            reader.readAsText(file);
          }
        };
        fileInput.click();
      });
    }
    function fetchSource(path) {
      return fetch(path).then(response => response.text());
    }

    const timeRaw = document.querySelector('.time .raw');
    const cache = new Map();
    async function runExample(path) {
      pre.textContent = "";
      const source = cache.get(path) ?? await fetchSource(path);
      cache.set(path, source);
      const start = performance.now();
      await run(source, path);
      const end = performance.now();
      timeRaw.textContent = (end - start).toFixed(2);
    }
    async function runFile(source, path) {
      pre.textContent = "";
      const start = performance.now();
      await run(source, path);
      const end = performance.now();
      timeRaw.textContent = (end - start).toFixed(2);
    }

    const { memory } = await init();
    setMemory(memory);

    const pre = document.querySelector('#output');

    queueMicrotask(async () => {
      const path = 'examples/hello.bf';
      await runExample(path);
    });

    const options = document.querySelector('#options');
    options.addEventListener('change', async (event) => {
      if (event.target.value === 'upload') {
        const { source, path } = await readFileFromSystem();
        await runFile(source, path);
        return;
      }
      const path = `examples/${event.target.value}`;
      await runExample(path);
    });

    for await (const chunk of output.readable) {
      pre.textContent += chunk;
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "imports.js": "./imports.js"
      }
    }
  </script>
</body>

</html>
