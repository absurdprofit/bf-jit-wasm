<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test</title>
</head>

<body>
  <pre id="output"></pre>
  <script type="module">
    import init, { run } from './bf_jit_wasm.js';
    import { setMemory, output } from './imports.js';

    const { memory } = await init();
    setMemory(memory);

    const pre = document.querySelector('#output');

    const path = 'examples/mandlebrot.bf';
    const response = await fetch(path);
    queueMicrotask(async () => {
      console.time('Run');
      await run(await response.text(), path);
      console.timeEnd('Run');
    });

    for await (const chunk of output.readable) {
      pre.textContent += chunk;
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "imports.js": "./imports.js"
      }
    }
  </script>
</body>

</html>
